[package]
name = "accordo-core"
version = "0.1.0"
edition = "2021"
description = "Accordo core for mobile: E2EE primitives (WebCrypto-compatible), exposed to Kotlin via uniffi"
license = "GPL-3.0-or-later"

[lib]
name = "accordo_core"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
uniffi = { version = "0.29", features = ["cli", "tokio"] }
aes-gcm = "0.10"
base64 = "0.22"
futures = "0.3"
hmac = "0.12"
mime_guess = "2.0.5"
p256 = { version = "0.13", features = ["ecdh", "jwk"] }
ring = "0.17"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
# Our own TLS roots instead of the platform verifier: the phone has no JNI glue for it yet, and
# bundled Mozilla roots behave the same on desktop and Android.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
webpki-roots = "0.26"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.54.1", features = ["time", "macros", "sync", "io-util", "rt"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
zeroize = "1"
getrandom = "0.4.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
pbkdf2 = "0.12"
